<!-- @dsCard height=300 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wichteln</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .red { fill:var(--red-500); }
  .red3 { fill:var(--red-300); }
  .green { fill:var(--green-500); }
  .mint { fill:var(--green-100); }
  .gold { fill:var(--gold); }
  .ground { fill:var(--surface); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:88px; line-height:.95; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; font-weight:600; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      red-500 tall slab 176x268 radius-xl bleeding off the top (the brand) · green-500 160x160 disc (secondary) · red-300 pill 160x80 · green-100 slab 128x200 bleeding right · gold disc 48 (the Christmas star) — about 40% of 960x300
  arrangement one tall red slab with round satellites, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     discs, from "corners are soft, never sharp" and Flocke's pom-pom fluff: space-4 and space-6 discs in surface cut out of the red slab, a short row on the mint slab
  scales      sides in space-4 multiples; gutters space-4; corners radius-xl, pills and discs half their short side
-->
<rect class="red" x="16" y="-28" width="176" height="296" rx="28"/>
<rect class="mint" x="352" y="68" width="144" height="200" rx="28"/>
<circle class="green" cx="288" cy="188" r="80"/>
<rect class="red3" x="208" y="16" width="160" height="80" rx="40"/>
<circle class="gold" cx="400" cy="40" r="24"/>
<circle class="ground" cx="60" cy="60" r="12"/>
<circle class="ground" cx="104" cy="44" r="8"/>
<circle class="ground" cx="148" cy="64" r="12"/>
<circle class="ground" cx="80" cy="104" r="8"/>
<circle class="ground" cx="128" cy="112" r="16"/>
<circle class="ground" cx="60" cy="156" r="16"/>
<circle class="ground" cx="104" cy="172" r="8"/>
<circle class="ground" cx="152" cy="168" r="8"/>
<circle class="red" cx="384" cy="232" r="12"/>
<circle class="red" cx="424" cy="232" r="8"/>
<circle class="red" cx="456" cy="232" r="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Wichteln</h1>
<p class="tag">Rot, Tannengrün und Gold mit Flocke.</p>
</div>
</div>
</body>
</html>
